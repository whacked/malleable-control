# Local process bus for GT / Emacs / terminal.
#
# Port 4223 rather than the default 4222 so this bus never collides with an
# unrelated NATS instance on the machine.
#
# Localhost only: see parent design section 15. There is no listener on any
# externally reachable interface, and no authentication is configured because
# the trust boundary is "processes running as this user".

host: "127.0.0.1"
port: 4223

server_name: "malleable-control"

# Kept low: every participant here is on loopback, so a slow consumer is a bug
# worth surfacing rather than buffering around.
max_pending: 8MB

# Terminal-friendly logging. bus-start redirects this to run/nats-server.log.
debug: false
trace: false
logtime: true
